<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineBlog | Dashboards</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/fonte.css">
    <link rel="stylesheet" href="./../css/dashboards.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

    </style>
</head>

<body>
    <div class="layout-dashboard">
        <aside class="sidebar">
            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>
            <ul>
                <li class="aba"><a href="dashboard.html">DASHBOARD</a></li>
                <li class="aba"><a href="../qu  iz2.html">QUIZ</a></li> 
            </ul>
            <div class="botao-sair">
                <button onclick="window.location='../login.html'" class="btn-sair"><h3>SAIR</h3></button>
            </div>
        </aside>
        
        <main class="conteudo-principal">
            
            <div class="kpi-container">
                <div class="kpi-card">
                    <h3>Sua Personalidade</h3>
                    <span id="kpi_personalidade">Carregando...</span>
                </div>
                
                <div class="kpi-card">
                    <h3>Jogadores com a mesma personalidade</h3>
                    <span id="kpi_qtd_usuarios">Carregando...</span>
                </div>
            </div>

            <div class="graficos-container">
                <div class="grafico">
                    <canvas id="myChart1"></canvas>
                </div>

                <div class="grafico">
                    <canvas id="myChart2"></canvas>
                </div>
            </div>

        </main>
    </div>

    <footer class="footer">
        <div>
            <div>
                <p>Site Desenvolvido por: Mateus Borges Galeani - 2026</p>
            </div>

                <ul>
                    <a href="https://github.com/galeanimateus?tab=repositories">GitHub</a> -
                    <a href="https://github.com/galeanimateus/mine-blog">Repositório</a> -

                </ul>
            </div>
        </div>
    </footer>   

</body>
</html>

<script>
    let nomesPersonalidades = {
        1: 'Construtor',
        2: 'Engenheiro',
        3: 'Guerreiro',
        4: 'Speedrunner',
        5: 'Acumulador',
        6: 'Sobrevivente'
    };

    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;
    window.onload = carregarDashboard();

    function carregarDashboard() {
        let idUsuario = sessionStorage.ID_USUARIO;

        fetch(`/quiz/obterPersonalidade/${idUsuario}`, {
            method: "GET",
            headers: {
            "Content-Type": "application/json",
            }
            }).then(function (resposta) {
            console.log("resposta: ", resposta);

            if (resposta.ok) {
            
            resposta.json().then(function (dados) {
                console.log("Dados recebidos do banco: ", dados);

                let id = dados[0].id_personalidade;
                
                document.getElementById('kpi_personalidade').innerHTML = nomesPersonalidades[id];

                buscarDadosDosGraficos();
                
            });

            } else {
            throw "Houve um erro ao tentar buscar os dados da dashboard!";
                document.getElementById('kpi_personalidade').innerHTML = "Faça o Quiz!";
                buscarDadosDosGraficos();
            }
            })
            .catch(function (erro) {
            console.log(`#ERRO: ${erro}`);
        });
        fetch("/quiz/obterEstatisticas", { 
            method: "GET",
            headers: {
            "Content-Type": "application/json",
            }
            }).then(function (resposta) {
            console.log("resposta: ", resposta);

            if (resposta.ok) {
                    
            resposta.json().then(function (dadosGerais) {
                console.log("Estatísticas gerais para os gráficos: ", dadosGerais);
                plotarGraficos(dadosGerais);

            });

            } else {
            throw "Houve um erro ao tentar buscar os dados da dashboard!";
            }
            })
            .catch(function (erro) {
            console.log(`#ERRO: ${erro}`);;
            })
    }

    function plotarGraficos(dadosGerais) {

        let labelsPersonalidades = [];
        let dadosQuantidade = [];
        
        let idUsuario = sessionStorage.ID_USUARIO;
        let qtdUsuariosMesmaPersonalidade = 0;

        for (let i = 0; i < dadosGerais.length; i++) {
            let registro = dadosGerais[i];
            let nomePersonalidade = nomesPersonalidades[registro.id_personalidade];
            
            labelsPersonalidades.push(nomePersonalidade);
            dadosQuantidade.push(registro.qtdUsuarios);

            if (nomePersonalidade == document.getElementById('kpi_personalidade').innerHTML) {
                qtdUsuariosMesmaPersonalidade = registro.qtdUsuarios;
            }
        }

        document.getElementById('kpi_qtd_usuarios').innerHTML = qtdUsuariosMesmaPersonalidade;

        const cores = ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40'];

        const ctx1 = document.getElementById('myChart1');
        new Chart(ctx1, {
            type: 'pie', 
            data: {
                labels: labelsPersonalidades,
                datasets: [{
                    data: dadosQuantidade,
                    backgroundColor: cores,
                    borderWidth: 1
                }]
            },
            options: {
                maintainAspectRatio: false,
                plugins: {
                    title: { display: true, text: 'Distribuição de Personalidades', font: { size: 16 } }
                }
            }
        });

        const ctx2 = document.getElementById('myChart2');
        new Chart(ctx2, {
            type: 'bar', 
            data: {
                labels: labelsPersonalidades,
                datasets: [{
                    label: 'Quantidade de Jogadores',
                    data: dadosQuantidade,
                    backgroundColor: cores,
                    borderWidth: 1
                }]
            },
            options: {
                maintainAspectRatio: false,
                plugins: {
                    title: { display: true, text: 'Ranking Geral', font: { size: 16 } },
                    legend: { display: false }
                },
                scales: { y: { beginAtZero: true } }
            }
        });
    }
</script>
