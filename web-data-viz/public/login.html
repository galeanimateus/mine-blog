                <ul>
                    <li><a href="index.html">SOBRE</a></li>
                    <li><a href="quiz.html">QUIZ</a></li>

    <main class="main-login">
        <div id="div_login">
            <div class="div-pai">
                <div class="div-filho" id="div_login_filho">
                    <h1 class="fonte-mine">Login Usuário</h1>
                    <div id="div_neto">
                        <span class="fonte-mine">Email</span> <br>
                        <input type="text" id="ipt_email" class="fonte-mine" placeholder="steve@sptech.school">
                        <br>

                        <div class="div-button" >

<script>

    function entrar() {

        let email = ipt_email.value;
        let senha = ipt_senha.value;

        if (email == "" || senha == "") {

            div_erro.classList.remove("concluido");
            div_erro.classList.add("erro", "fonte-mine");
            div_erro.innerHTML = `Email ou senha inválido!`;
            return false;
        }
        

        console.log("FORM LOGIN: ", email);
        console.log("FORM SENHA: ", senha);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: email,
                senhaServer: senha
            })
        }).then(function (resposta) {
            
            if (resposta.ok) {
                console.log(resposta);

                div_erro.classList.remove("erro");
                div_erro.classList.add("concluido", "fonte-mine");

                div_erro.innerHTML = "Login realizado com sucesso!"

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 2000);

                });

            } else {

                div_erro.classList.remove("concluido", "fonte-mine");
                div_erro.classList.add("erro");
                div_erro.innerHTML = "Houve um erro ao tentar realizar o login!";

                resposta.text().then(texto => {
                    console.error(texto);
                    // finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

</script>
